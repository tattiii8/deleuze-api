name: CI to AWS ECR

on:
  push:
    branches: [ main ]
    paths:
      - 'deleuze-auth/**'
      - 'deleuze-app/**'
      - 'deleuze-mng/**'
      - 'deleuze-drive/**'
      - '.github/workflows/**'
  workflow_dispatch: # ★ これを追加することで「Run workflow」ボタンが表示されます

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 871950640338.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth:  ${{ steps.filter.outputs.auth }}
      app:   ${{ steps.filter.outputs.app }}
      mng:   ${{ steps.filter.outputs.mng }}
      drive: ${{ steps.filter.outputs.drive }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          auth:  ['deleuze-auth/**']
          app:   ['deleuze-app/**']
          mng:   ['deleuze-mng/**']
          drive: ['deleuze-drive/**']

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to AWS ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push deleuze-auth
      if: ${{ needs.changes.outputs.auth == 'true' || github.event_name == 'workflow_dispatch' }}
      uses: docker/build-push-action@v5
      with:
        context: ./deleuze-auth
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.ECR_REGISTRY }}/deleuze-auth:latest
          ${{ env.ECR_REGISTRY }}/deleuze-auth:${{ github.sha }}

    - name: Build and Push deleuze-app
      if: ${{ needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch' }}
      uses: docker/build-push-action@v5
      with:
        context: ./deleuze-app
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.ECR_REGISTRY }}/deleuze-app:latest
          ${{ env.ECR_REGISTRY }}/deleuze-app:${{ github.sha }}

    - name: Build and Push deleuze-mng
      if: ${{ needs.changes.outputs.mng == 'true' || github.event_name == 'workflow_dispatch' }}
      uses: docker/build-push-action@v5
      with:
        context: ./deleuze-mng
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.ECR_REGISTRY }}/deleuze-mng:latest
          ${{ env.ECR_REGISTRY }}/deleuze-mng:${{ github.sha }}

    - name: Build and Push deleuze-drive
      if: ${{ needs.changes.outputs.drive == 'true' || github.event_name == 'workflow_dispatch' }}
      uses: docker/build-push-action@v5
      with:
        context: ./deleuze-drive
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.ECR_REGISTRY }}/deleuze-drive:latest
          ${{ env.ECR_REGISTRY }}/deleuze-drive:${{ github.sha }}