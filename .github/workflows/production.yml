name: CI to AWS ECR

on:
  push:
    branches: [ main ]
    paths:
      - 'deleuze-auth/**'
      - 'deleuze-mng/**'
      - 'deleuze-shared/**' # ★ deleuze-shared の変更も検知対象に追加
      - '.github/workflows/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 871950640338.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth:  ${{ steps.filter.outputs.auth }}
      mng:   ${{ steps.filter.outputs.mng }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          auth:  ['deleuze-auth/**', 'deleuze-shared/**']
          mng:   ['deleuze-mng/**', 'deleuze-shared/**']

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to AWS ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push deleuze-auth
      if: ${{ needs.changes.outputs.auth == 'true' || github.event_name == 'workflow_dispatch' }}
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deleuze-auth/Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.ECR_REGISTRY }}/deleuze-auth:latest
          ${{ env.ECR_REGISTRY }}/deleuze-auth:${{ github.sha }}

    - name: Build and Push deleuze-mng
      if: ${{ needs.changes.outputs.mng == 'true' || github.event_name == 'workflow_dispatch' }}
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./deleuze-mng/Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.ECR_REGISTRY }}/deleuze-mng:latest
          ${{ env.ECR_REGISTRY }}/deleuze-mng:${{ github.sha }}
