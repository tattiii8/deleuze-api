x-db-common: &db-common
  image: ${POSTGRES_IMAGE}
  command: ["-c", "log_statement=all"]
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:
  deleuze-auth-db:
    <<: *db-common
    container_name: deleuze-auth-db
    ports:
      - "${AUTH_DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - deleuze_auth_db_data:/var/lib/postgresql/data

  deleuze-mng-db:
    <<: *db-common
    container_name: deleuze-mng-db
    ports:
      - "${MNG_DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${MNG_DB_NAME}
    volumes:
      - deleuze_mng_db_data:/var/lib/postgresql/data

  deleuze-drive-db:
    <<: *db-common
    container_name: deleuze-drive-db
    ports:
      - "${DRIVE_DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DRIVE_DB_NAME}
    volumes:
      - deleuze_drive_db_data:/var/lib/postgresql/data

volumes:
  deleuze_auth_db_data:
  deleuze_mng_db_data:
  deleuze_drive_db_data: