version: '3.8'

services:
  # 1. 認証用データベース
  deleuze-auth-db:
    image: postgres:16-alpine
    container_name: deleuze-auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deleuze-auth
    ports:
      - "5432:5432"
    volumes:
      - auth-pgdata:/var/lib/postgresql/data

  # 2. 業務アプリ用データベース（マルチテナント）
  deleuze-app-db:
    image: postgres:16-alpine
    container_name: deleuze-app-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deleuze-app
    ports:
      - "5433:5432" # ホスト側のポートを5433にずらしてポート競合を回避
    volumes:
      - app-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # アプリ用DBの初期化が必要な場合

  deleuze-auth:
    image: deleuze-auth
    platform: linux/arm64
    build:
      context: ./deleuze-auth
      dockerfile: Dockerfile
    container_name: deleuze-auth
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # 認証APIは認証DBのみに接続する
      - ConnectionStrings__DefaultConnection=Host=deleuze-auth-db;Database=authdb;Username=postgres;Password=password
    depends_on:
      - deleuze-auth-db

  deleuze-app:
    image: deleuze-app
    platform: linux/arm64 
    build:
      context: ./deleuze-app
      dockerfile: Dockerfile
    container_name: deleuze-app
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # 業務アプリAPIは業務アプリDBのみに接続する
      - ConnectionStrings__DefaultConnection=Host=deleuze-app-db;Database=appdb;Username=postgres;Password=password
    depends_on:
      - deleuze-app-db
      - deleuze-auth

  deleuze-mng:
    image: deleuze-mng
    platform: linux/arm64
    build:
      context: ./deleuze-mng
      dockerfile: Dockerfile
    container_name: deleuze-mng
    ports:
      - "5003:8080" # 管理用APIポート
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # 管理APIは、テナントプロビジョニングのために「両方のDB」へアクセスできるように設定を分ける
      - ConnectionStrings__AuthConnection=Host=deleuze-auth-db;Database=authdb;Username=postgres;Password=password
      - ConnectionStrings__AppConnection=Host=deleuze-app-db;Database=appdb;Username=postgres;Password=password
    depends_on:
      - deleuze-auth-db
      - deleuze-app-db

volumes:
  # データボリュームも分離
  deleuze-auth-pgdata:
  deleuze-app-pgdata: