x-db-common: &db-common
  image: postgres:16-alpine
  command: ["-c", "log_statement=all"]
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-dotnet-watch: &dotnet-watch
  image: mcr.microsoft.com/dotnet/sdk:8.0
  working_dir: /app
  volumes:
    - .:/app
  environment:
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    DOTNET_USE_POLLING_FILE_WATCHER: "true"
  command: dotnet watch run --non-interactive

services:
  # --- Databases ---
  deleuze-auth-db:
    <<: *db-common
    container_name: deleuze-auth-db
    ports:
      - "${AUTH_DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - deleuze_auth_db_data:/var/lib/postgresql/data

  deleuze-mng-db:
    <<: *db-common
    container_name: deleuze-mng-db
    ports:
      - "${MNG_DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${MNG_DB_NAME}
    volumes:
      - deleuze_mng_db_data:/var/lib/postgresql/data

  # deleuze-drive-db:
  #   <<: *db-common
  #   container_name: deleuze-drive-db
  #   ports:
  #     - "${DRIVE_DB_PORT}:5432"
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${DRIVE_DB_NAME}
  #   volumes:
  #     - deleuze_drive_db_data:/var/lib/postgresql/data

  # --- APIs (Hot Reload) ---
  deleuze-auth:
    <<: *dotnet-watch
    container_name: deleuze-auth
    working_dir: /app/deleuze-auth
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://0.0.0.0:5001
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__AuthConnection: ${CONN_AUTH_DB}
      AUTH_EXTERNAL_URL: ${AUTH_EXTERNAL_URL}
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL}

      # JWT
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES}
    depends_on:
      - deleuze-auth-db

  deleuze-mng:
    <<: *dotnet-watch
    container_name: deleuze-mng
    working_dir: /app/deleuze-mng
    ports:
      - "5002:5002"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://0.0.0.0:5002
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__MngConnection: ${CONN_MNG_DB}
      ConnectionStrings__AuthConnection: ${CONN_AUTH_DB}
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL}
      MANAGEMENT_API_SECRET: ${MANAGEMENT_API_SECRET}
      ENABLE_MNG_AUTH: ${ENABLE_MNG_AUTH}
    depends_on:
      - deleuze-mng-db
      - deleuze-auth-db

  # deleuze-drive:
  #   <<: *dotnet-watch
  #   container_name: deleuze-drive
  #   working_dir: /app/deleuze-drive
  #   ports:
  #     - "5003:5003"
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
  #     ASPNETCORE_URLS: http://0.0.0.0:5003
  #     DOTNET_USE_POLLING_FILE_WATCHER: "true"
  #     ConnectionStrings__DefaultConnection: ${CONN_DRIVE_DB}
  #     AUTH_EXTERNAL_URL: ${AUTH_EXTERNAL_URL}
  #     AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL}
  #   depends_on:
  #     - deleuze-drive-db

volumes:
  deleuze_auth_db_data:
  deleuze_mng_db_data:
  # deleuze_drive_db_data: